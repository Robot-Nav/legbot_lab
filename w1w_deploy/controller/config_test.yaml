    - FL_hip
    - FL_thigh
    - FL_calf
    - FL_wheel
    - FR_hip
    - FR_thigh
    - FR_calf
    - FR_wheel
    - RL_hip
    - RL_thigh
    - RL_calf
    - RL_wheel
    - RR_hip
    - RR_thigh
    - RR_calf
    - RR_wheel
  default_angles: [0.0, -0.68, 1.4, 0.0, 0.0, 0.68, -1.4, 0.0, 0.0, -0.68, 1.4, 0.0, 0.0, 0.68, -1.4, 0.0]

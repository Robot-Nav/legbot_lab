# `play.py` exports the CTS policy into <run>/exported/policy.pt.
# Pass that file with: deploy_legbot.py --policy /path/to/policy.pt
policy_path: "{ROOT_DIR}/deploy/pre_train/legbot/policy.pt"
xml_path: "{ROOT_DIR}/resources/legbot_wf/legbot.xml"

render_fps: 60
video_fps: 60
save_video: false
simulation_duration: 60000000.0

# Match Isaac Lab: simulation_dt * control_decimation = 0.02 s (50 Hz).
simulation_dt: 0.005
control_decimation: 4
base_init_pos: [0.0, 0.0, 0.46]
base_init_quat: [1.0, 0.0, 0.0, 0.0]

actuator_delay_min: 0
actuator_delay_max: 0
actuator_delay_seed: 0

# Arrays below use MuJoCo joint order (each leg has hip/thigh/calf/wheel).
kps: [60.0, 60.0, 60.0, 0.0,
      60.0, 60.0, 60.0, 0.0,
      60.0, 60.0, 60.0, 0.0,
      60.0, 60.0, 60.0, 0.0]
kds: [4.0, 4.0, 4.0, 1.0,
      4.0, 4.0, 4.0, 1.0,
      4.0, 4.0, 4.0, 1.0,
      4.0, 4.0, 4.0, 1.0]
torque_limit: [120.0, 120.0, 175.38, 28.68,
               120.0, 120.0, 175.38, 28.68,
               120.0, 120.0, 175.38, 28.68,
               120.0, 120.0, 175.38, 28.68]
default_angles: [0.0, -0.9, 1.8, 0.0,
                 0.0,  0.9, -1.8, 0.0,
                 0.0, -0.9, 1.8, 0.0,
                 0.0,  0.9, -1.8, 0.0]

ang_vel_scale: 0.25
dof_pos_scale: 1.0
dof_vel_scale: 0.05
action_pos_scale: 0.25
action_vel_scale: 20.0
cmd_scale: [1.0, 1.0, 1.0]

num_actions: 16
num_leg_joints: 12
num_obs: 53
history_len: 10
max_cmd: [2.0, 1.0, 2.0]
cmd_init: [0.5, 0.0, 0.0]

mujoco_joint_names: [
  "fl_hip_joint", "fl_thigh_joint", "fl_calf_joint", "fl_foot_joint",
  "fr_hip_joint", "fr_thigh_joint", "fr_calf_joint", "fr_foot_joint",
  "rl_hip_joint", "rl_thigh_joint", "rl_calf_joint", "rl_foot_joint",
  "rr_hip_joint", "rr_thigh_joint", "rr_calf_joint", "rr_foot_joint",
]

# Exact action/observation order from Legbot ActionsCfg.
model_joint_names: [
  "fl_hip_joint", "fl_thigh_joint", "fl_calf_joint",
  "fr_hip_joint", "fr_thigh_joint", "fr_calf_joint",
  "rl_hip_joint", "rl_thigh_joint", "rl_calf_joint",
  "rr_hip_joint", "rr_thigh_joint", "rr_calf_joint",
  "fl_foot_joint", "fr_foot_joint", "rl_foot_joint", "rr_foot_joint",
]
